# .github/workflows/publish-sonatype.yml
#
# Release flow, copied from visiblelayer (PLT-1360) by hl-sdk-gen's SDK repo
# template (PLT-1425): publishing the bot's draft release consumes the pending
# changesets, publishes to Maven Central, and commits the version bump to main as
# HL-OpenSource-Exporter. Guards fail the run, before anything is published or
# committed, when the release doesn't match the changeset state.
#
# Invariants:
#   - Both jobs work from the commit the release was published at
#     (github.sha), never from main's tip, so what's published, what's
#     committed and what the tag points at are one tree even when a PR merges
#     while the run is going.
#   - Guards 1-3 run before any side effect, so a bad release leaves main
#     untouched and nothing published.
#   - Publish runs before the commit-back and skips a version that's already
#     on Maven Central, so a failure anywhere after the build is fixed by re-running
#     the workflow (all jobs or failed jobs, either works), not by publishing
#     by hand from a tag.
#   - build runs npm and Gradle with no environment and no secret. It hands
#     publish the staged Maven repository, CHANGELOG.md and the list of
#     consumed changesets; publish signs and uploads it with gpg and curl. publish runs neither, checks the artifact's
#     name and version against the tag before uploading, accepts only plain
#     .changeset/<name>.md paths, and rebuilds the version commit itself with
#     scripts/sync-version.mjs, which uses only Node's builtins. A compromised
#     dependency can't reach the exporter key, publish another package or put
#     code on main.
#   - The exporter token is minted after the publish. It is a bypass actor on
#     main's ruleset.
#   - If main moved during the run, the version commit is merged into main
#     rather than rebased, so the tag stays on the published tree and a
#     changeset merged meanwhile stays pending for the next release.
#
# Admin prerequisites (the run fails at token minting until they exist):
#   - the repo on HL-OpenSource-Exporter's allow-list, and the exporter as a
#     bypass actor on the main branch ruleset
#   - an os-export environment holding OS_EXPORTER_APP_PRIVATE_KEY, with a
#     deployment policy of main plus v* tags
#
# Accepted trade-offs (platform team, 2026-09-18): release events run this
# file from the tag's commit and tag creation is unrestricted, so anyone who
# can push a v* tag can run a modified copy of it with the key. The upload
# precedes the version commit, so the POM's scm points at the commit before
# the bump. Changesets pre mode isn't supported.

name: Publish Sonatype

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # groupId:artifactId, set by .github/release/maven-central.init.gradle
  PACKAGE: com.hiddenlayer.api:hiddenlayer-java
  SDK_LANGUAGE: java
  TAG: ${{ github.event.release.tag_name }}

jobs:
  build:
    # hiddenlayerai has no scale-set runners
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # @changesets/changelog-github reads each changeset commit's associatedPullRequests.
      pull-requests: read
    outputs:
      mode: ${{ steps.guard1.outputs.mode }}
    steps:
      - name: Resolve the version
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Checkout the published commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the release was published at, not main's tip.
          ref: ${{ github.sha }}
          # The changeset changelog generator reads commit history.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # A restored cache must not be able to change what a release ships.
          package-manager-cache: false

      - name: Install the release tooling
        # Only changesets runs here, so no install script needs to.
        run: |
          # The package manager comes from package.json's packageManager pin, which Corepack enforces; the ledgers have none.
          case "$(node -p "(require('./package.json').packageManager ?? 'npm').split('@')[0]")" in
            pnpm) corepack enable && pnpm install --frozen-lockfile --ignore-scripts ;;
            yarn) corepack enable && YARN_ENABLE_SCRIPTS=false yarn install --immutable ;;
            *) npm ci --ignore-scripts ;;
          esac

      - name: "Guard 1: pending changesets exist, or the published commit already carries this release"
        id: guard1
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name README.md | grep -q .; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
          elif [ "$(node -p "require('./package.json').version")" = "$VERSION" ]; then
            echo "The published commit already carries $VERSION: resuming at the publish check and the tag move."
            echo "mode=resume" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No pending changesets in .changeset/ and the published commit isn't at $VERSION: nothing to version or publish for this release."
            exit 1
          fi

      - name: Apply changesets (version bump, changelog, sync)
        if: steps.guard1.outputs.mode == 'release'
        env:
          # @changesets/changelog-github looks up each changeset's PR and author.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run version-packages

      - name: "Guard 2: release tag matches the computed version"
        if: steps.guard1.outputs.mode == 'release'
        run: |
          COMPUTED=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$COMPUTED" ]; then
            echo "::error::Release tag '$TAG' does not match the changeset-computed version '$COMPUTED'. Nothing was committed or published: delete this release and publish one tagged v$COMPUTED."
            exit 1
          fi

      - name: Setup Java
        if: steps.guard1.outputs.mode == 'release'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        if: steps.guard1.outputs.mode == 'release'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # A restored cache must not be able to change what a release ships.
          cache-disabled: true

      - name: Build and stage the Maven repository
        if: steps.guard1.outputs.mode == 'release'
        run: ./gradlew --no-configuration-cache --init-script .github/release/maven-central.init.gradle publishMavenPublicationToStagingRepository

      - name: "Guard 3: Gradle and the staged POM carry the tag's version"
        if: steps.guard1.outputs.mode == 'release'
        run: |
          GRADLE_VERSION=$(./gradlew -q --no-configuration-cache properties | sed -n 's/^version: //p')
          GROUP_PATH=${PACKAGE%%:*}
          POM="build/staging-deploy/${GROUP_PATH//.//}/${PACKAGE#*:}/$VERSION/${PACKAGE#*:}-$VERSION.pom"
          POM_VERSION=$(sed -n 's|^  <version>\(.*\)</version>$|\1|p' "$POM" 2>/dev/null)
          if [ "$GRADLE_VERSION" != "$VERSION" ] || [ "$POM_VERSION" != "$VERSION" ]; then
            echo "::error::Gradle has version '$GRADLE_VERSION' and $POM has '$POM_VERSION', expected $PACKAGE $VERSION. Nothing was committed or published."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release"
          cp -r build/staging-deploy "$RUNNER_TEMP/release/dist"
          find "$RUNNER_TEMP/release/dist" -type f

      - name: Collect what publish needs
        if: steps.guard1.outputs.mode == 'release'
        run: |
          cp CHANGELOG.md "$RUNNER_TEMP/release/"
          git diff --name-only --diff-filter=D -- .changeset > "$RUNNER_TEMP/release/consumed-changesets.txt"

      - name: Upload release
        if: steps.guard1.outputs.mode == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          # A re-run of all jobs rebuilds from the same commit and replaces it.
          overwrite: true
          retention-days: 7

  publish:
    needs: build
    # hiddenlayerai has no scale-set runners
    runs-on: ubuntu-latest
    environment: os-export
    permissions:
      # The release notes tidy-up; the commit and tag push use the exporter's token.
      contents: write
    env:
      MODE: ${{ needs.build.outputs.mode }}
    steps:
      - name: Resolve the version
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Checkout the published commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the release was published at, not main's tip.
          ref: ${{ github.sha }}
          # The changeset changelog generator reads commit history.
          fetch-depth: 0
          persist-credentials: false

      - name: Download release
        if: env.MODE == 'release'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: "Check the artifact: one staged version, named and versioned as the tag"
        if: env.MODE == 'release'
        run: |
          cd "$RUNNER_TEMP/release/dist"
          GROUP_PATH=${PACKAGE%%:*}
          ARTIFACT="${GROUP_PATH//.//}/${PACKAGE#*:}"
          STRAY=$(find . -type f ! -path "./$ARTIFACT/$VERSION/*" ! -path "./$ARTIFACT/maven-metadata*")
          if [ -n "$STRAY" ] || [ ! -d "$ARTIFACT/$VERSION" ]; then
            echo "::error::Expected only $ARTIFACT/$VERSION in the staged repository; stray files: $STRAY"
            exit 1
          fi
          POM="$ARTIFACT/$VERSION/${PACKAGE#*:}-$VERSION.pom"
          POM_VERSION=$(sed -n 's|^  <version>\(.*\)</version>$|\1|p' "$POM" 2>/dev/null)
          if [ "$POM_VERSION" != "$VERSION" ] || [ ! -f "$ARTIFACT/$VERSION/${PACKAGE#*:}-$VERSION.jar" ]; then
            echo "::error::The staged POM has version '$POM_VERSION' or the jar is missing; expected $PACKAGE $VERSION. Nothing was published or committed."
            exit 1
          fi

      - name: Publish to Maven Central
        env:
          SONATYPE_USERNAME: ${{ secrets.HIDDENLAYER_SONATYPE_USERNAME || secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.HIDDENLAYER_SONATYPE_PASSWORD || secrets.SONATYPE_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.HIDDENLAYER_SONATYPE_GPG_SIGNING_KEY || secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.HIDDENLAYER_SONATYPE_GPG_SIGNING_PASSWORD || secrets.GPG_SIGNING_PASSWORD }}
        run: |
          # Central Portal Publisher API: https://central.sonatype.org/publish/publish-portal-api/
          API=https://central.sonatype.com/api/v1/publisher
          # The bearer token is masked and read by curl from a file, so it's never on argv.
          BEARER=$(printf '%s:%s' "$SONATYPE_USERNAME" "$SONATYPE_PASSWORD" | base64 -w0)
          echo "::add-mask::$BEARER"
          AUTH="$RUNNER_TEMP/central-auth"
          printf 'Authorization: Bearer %s\n' "$BEARER" > "$AUTH"
          PUBLISHED=$(curl -sf -H @"$AUTH" "$API/published?namespace=${PACKAGE%%:*}&name=${PACKAGE#*:}&version=$VERSION" | jq -r .published || true)
          if [ "$PUBLISHED" = "true" ]; then
            echo "$PACKAGE:$VERSION is already on Maven Central; skipping (re-run after a later failure)."
            exit 0
          elif [ "$PUBLISHED" != "false" ]; then
            echo "::error::Couldn't ask the Central Portal whether $PACKAGE:$VERSION is published."
            exit 1
          elif [ "$MODE" = "resume" ]; then
            echo "::error::The published commit carries $VERSION but Maven Central has no $PACKAGE:$VERSION. Publish it from the version commit by hand, then re-run."
            exit 1
          fi
          printenv GPG_SIGNING_KEY | gpg --batch --import
          cd "$RUNNER_TEMP/release/dist"
          # Gradle staged the checksums; Central needs a signature on each artifact.
          find . -type f \( -name '*.jar' -o -name '*.pom' -o -name '*.module' \) | while read -r file; do
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign "$file" <<< "$GPG_SIGNING_PASSWORD"
          done
          zip -qr "$RUNNER_TEMP/bundle.zip" . -x '*maven-metadata*'
          DEPLOYMENT=$(curl -sf -H @"$AUTH" -F bundle=@"$RUNNER_TEMP/bundle.zip" \
            "$API/upload?name=${PACKAGE#*:}-$VERSION&publishingType=AUTOMATIC")
          echo "Uploaded deployment $DEPLOYMENT"
          # Sonatype can take over an hour to report a release published; give up after two, and a re-run picks up from the published check.
          for _ in $(seq 360); do
            STATUS=$(curl -sf -X POST -H @"$AUTH" "$API/status?id=$DEPLOYMENT" || true)
            STATE=$(jq -r '.deploymentState // empty' <<< "$STATUS" 2>/dev/null || true)
            case "$STATE" in
              PUBLISHED) echo "Published $PACKAGE:$VERSION"; exit 0 ;;
              FAILED) echo "::error::Deployment $DEPLOYMENT failed: $(jq -c .errors <<< "$STATUS")"; exit 1 ;;
              *) echo "Deployment $DEPLOYMENT is ${STATE:-not reported yet}"; sleep 20 ;;
            esac
          done
          echo "::error::Deployment $DEPLOYMENT wasn't published within two hours; re-run once the Central Portal shows it published."
          exit 1

      - name: Mint HL-OpenSource-Exporter token
        id: app
        # app-token-action is private to hiddenlayer-engineering, so a hiddenlayerai repo can't use it.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23liEbo0PaG2pWfdGX # HL-OpenSource-Exporter, from app-token-action's registry
          private-key: ${{ secrets.OS_EXPORTER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Commit the version bump to main
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          # The helper reads the token from the environment when git runs it, so it's never written to disk.
          # shellcheck disable=SC2016
          token_git() { git -c credential.helper='!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f' "$@"; }
          token_git fetch -q origin main
          if [ -n "$(git log -1 --format=%H --grep="^chore(release): version ${VERSION//./\\.}\$" origin/main)" ]; then
            echo "main already carries the version commit for $VERSION; nothing to commit."
            exit 0
          fi
          if [ "$(node -p "require('./package.json').version")" = "$VERSION" ]; then
            echo "The published commit already carries $VERSION; no version commit to make."
            exit 0
          fi
          node scripts/sync-version.mjs "$SDK_LANGUAGE" "$VERSION"
          cp "$RUNNER_TEMP/release/CHANGELOG.md" CHANGELOG.md
          while read -r changeset; do
            [ "$changeset" = .changeset/README.md ] && continue
            if [[ ! "$changeset" =~ ^\.changeset/[A-Za-z0-9_-]+\.md$ ]]; then
              echo "::error::'$changeset' is not a changeset path; refusing the hand-off."
              exit 1
            fi
            git rm -q -- "$changeset"
          done < "$RUNNER_TEMP/release/consumed-changesets.txt"
          git add -u .
          git add -- CHANGELOG.md
          if git diff --cached --quiet; then
            echo "::error::The version bump staged no changes; refusing to push a release commit without one."
            exit 1
          fi
          echo "Committing:"
          git diff --cached --name-status
          BOT="${APP_SLUG}[bot]"
          BOT_ID=$(gh api "users/$BOT" --jq .id)
          bot_git() {
            token_git -c user.name="$BOT" -c user.email="$BOT_ID+$BOT@users.noreply.github.com" -c core.hooksPath=/dev/null "$@"
          }
          bot_git commit -q -m "chore(release): version $VERSION"
          BUMP=$(git rev-parse HEAD)
          echo "Version commit $BUMP"
          # If main moved during the run, merge the bump into it rather than rebase: the
          # tag then points at the published tree, and a changeset merged meanwhile stays pending.
          for _ in 1 2 3; do
            token_git fetch -q origin main
            if git merge-base --is-ancestor origin/main "$BUMP"; then
              bot_git push -q origin "$BUMP:refs/heads/main" && exit 0
            else
              git checkout -q -B release-merge origin/main
              bot_git merge -q --no-ff -m "chore(release): merge version $VERSION into main" "$BUMP" \
                || { echo "::error::The version commit conflicts with what landed on main after the commit this run worked from. Re-run all jobs, not only the failed ones: a re-run of this job alone replays the same commit and conflicts again. If all jobs conflict too, reconcile the change on main by hand first (hl-sdk-gen docs/releasing-*.md, Recovery)."; exit 1; }
              bot_git push -q origin HEAD:refs/heads/main && exit 0
              git checkout -q "$BUMP"
            fi
          done
          echo "::error::main kept moving; re-run all jobs to try again."
          exit 1

      - name: Point the release tag at the version commit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # shellcheck disable=SC2016
          token_git() { git -c credential.helper='!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f' "$@"; }
          token_git fetch -q origin main
          COMMIT=$(git log -1 --format=%H --grep="^chore(release): version ${VERSION//./\\.}\$" origin/main)
          if [ -z "$COMMIT" ]; then
            echo "::error::No version commit for $VERSION on main."
            exit 1
          fi
          git tag -f "$TAG" "$COMMIT"
          token_git push -f origin "refs/tags/$TAG"

      - name: Tidy the published release notes
        # Cosmetic only: replace the draft's marker, instruction and preview with
        # the changelog section the version commit wrote. Never fail a release
        # that already shipped over release-note formatting.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ github.event.release.id }}
          MARKER: "<!-- ${{ github.event.repository.name }}-draft-release-bot -->"
        run: |
          BODY=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.body // ""')
          case "$BODY" in
            "$MARKER"*)
              # origin/main was fetched by the tag step.
              COMMIT=$(git log -1 --format=%H --grep="^chore(release): version ${VERSION//./\\.}\$" origin/main)
              git show "$COMMIT:CHANGELOG.md" | awk -v v="$VERSION" '/^## /{p = ($2 == v)} p' > "$RUNNER_TEMP/notes.md"
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
                -F body=@"$RUNNER_TEMP/notes.md" > /dev/null
              echo "Release notes set to the changelog section for $VERSION."
              ;;
            *)
              echo "Release notes are not bot-authored; left unchanged."
              ;;
          esac
