# .github/workflows/ci.yml
#
# Checks the formatting, builds and tests the package on every PR and every
# push to main: the generated client with Fern's tests, and the wrapper with
# its own (PLT-1430). Fern PRs merge on green, so this is the gate between a
# generation and main.
#
# Invariants:
#   - No secret, no write permission and no cache: this runs on PRs from
#     anyone, and a cache written on main is one the release's build could
#     restore.
#   - Keep lint, build and test as one job each, under those names: main's
#     ruleset requires the three contexts, and the hand-off waits for every
#     required one.
#   - test compiles and runs on Java 8, the oldest the published jar
#     supports, so Gradle itself runs on Java 8 there: a generator upgrade
#     that raises Gradle's or a plugin's own Java floor fails this job.
#   - build stages the Maven repository as publish-sonatype.yml does, on the
#     same JDK and with the same init script, which compiles for Java 8's
#     class library, and checks what a release would upload. So SDK code
#     that calls something Java 8 lacks, or a broken publication, fails its
#     PR instead of the release. A dependency that needs a newer Java is
#     caught only where test's Java 8 compile or a test reaches it.
#   - Each job's timeout stays within the 15 minutes the hand-off waits for
#     a Fern PR's checks.
#
# From hl-sdk-gen's template/; edit it there and copy it into the repo.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # groupId:artifactId, set by .github/release/maven-central.init.gradle
  PACKAGE: com.hiddenlayer.api:hiddenlayer-java

jobs:
  lint:
    # hiddenlayerai has no scale-set runners
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Check the formatting
        run: ./gradlew spotlessCheck

  build:
    # hiddenlayerai has no scale-set runners
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Build and stage the Maven repository
        run: ./gradlew --no-configuration-cache --init-script .github/release/maven-central.init.gradle publishMavenPublicationToStagingRepository

      - name: Check what a release would upload
        run: |
          VERSION=$(./gradlew -q --no-configuration-cache properties | sed -n 's/^version: //p')
          GROUP=${PACKAGE%%:*}
          ARTIFACT=${PACKAGE#*:}
          STAGED="build/staging-deploy/${GROUP//.//}/$ARTIFACT/$VERSION"
          for file in "$ARTIFACT-$VERSION.pom" "$ARTIFACT-$VERSION.jar" "$ARTIFACT-$VERSION-sources.jar" "$ARTIFACT-$VERSION-javadoc.jar"; do
            if [ ! -f "$STAGED/$file" ]; then
              echo "::error::$STAGED/$file wasn't staged; Maven Central needs the POM and the jar with its sources and javadoc. Staged: $(find build/staging-deploy -type f \( -name '*.pom' -o -name '*.jar' \) | sort | tr '\n' ' ')"
              exit 1
            fi
          done

  test:
    # hiddenlayerai has no scale-set runners
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "8"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Test on Java 8
        run: ./gradlew test
